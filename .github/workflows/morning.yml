name: Morning Sky Brief

on:
  schedule:
    # 11:00 UTC = 6:00 AM CDT (summer) / 5:00 AM CST (winter)
    - cron: '43 10 * * *'
  workflow_dispatch:  # Lets you press a "Run" button manually to test

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Skyfield data
        uses: actions/cache@v4
        with:
          path: ./skyfield_data
          key: skyfield-data
          restore-keys: |
            skyfield-data-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily brief
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python daily_brief.py
